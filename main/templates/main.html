<!-- Container untuk Render Cards secara AJAX -->
<div id="item_cards_container" class="grid grid-cols-1 md:grid-cols-3 gap-4 my-6">
    <!-- Data dari Fetch API akan dirender di sini -->
</div>

<!-- Button untuk Membuka Modal -->
<button type="button" onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">
    Add New Item via AJAX
</button>

<!-- Modal Dialog -->
<div id="crudModal" tabindex="-1" aria-hidden="true" class="hidden fixed inset-0 z-50 overflow-y-auto bg-gray-800 bg-opacity-50 justify-center items-center flex">
    <div class="relative p-4 w-full max-w-md max-h-full bg-white rounded-lg shadow">
        <!-- Modal Header -->
        <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
            <h3 class="text-lg font-semibold text-gray-900">Add New Item</h3>
            <button type="button" onclick="closeModal()" class="text-gray-400 hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center">
                ✕
            </button>
        </div>
        <!-- Modal Body / Form -->
        <form id="form" class="p-4 md:p-5">
            {% csrf_token %}
            <div class="grid gap-4 mb-4 grid-cols-2">
                <div class="col-span-2">
                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Name</label>
                    <input type="text" name="name" id="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="Item Name" required="">
                </div>
                <div class="col-span-2">
                    <label for="amount" class="block mb-2 text-sm font-medium text-gray-900">Amount</label>
                    <input type="number" name="amount" id="amount" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="1" required="">
                </div>
                <div class="col-span-2">
                    <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
                    <textarea id="description" name="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="Write item description..."></required="">
                </div>
            </div>
            <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                Submit Item
            </button>
        </form>
    </div>
</div>

<script>
    // 1. Fungsi Fetch Data dari Endpoint JSON
    async function getItems() {
        return fetch("{% url 'main:get_items_json' %}").then((res) => res.json())
    }

    // 2. Fungsi Render Cards ke DOM secara Dinamis
    async function refreshItems() {
        const container = document.getElementById("item_cards_container");
        container.innerHTML = "";
        const items = await getItems();

        if (items.length === 0) {
            container.innerHTML = `<p class="text-gray-500 italic">Belum ada item tersimpan.</p>`;
            return;
        }

        let htmlString = "";
        items.forEach((item) => {
            htmlString += `
            <div class="bg-white shadow-md rounded-lg p-5 border border-gray-200">
                <h3 class="text-xl font-bold text-gray-800 mb-2">${item.fields.name}</h3>
                <p class="text-sm text-gray-600 mb-1">Jumlah: <span class="font-semibold">${item.fields.amount}</span></p>
                <p class="text-gray-700 mt-2">${item.fields.description}</p>
            </div>`;
        });
        
        container.innerHTML = htmlString;
    }

    // Panggil saat halaman pertama kali dimuat
    refreshItems();

    // 3. Modal Controls
    function openModal() {
        document.getElementById("crudModal").classList.remove("hidden");
    }

    function closeModal() {
        document.getElementById("crudModal").classList.add("hidden");
        document.getElementById("form").reset();
    }

    // 4. Submit Form via AJAX POST (Fetch API)
    document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        
        fetch("{% url 'main:add_item_ajax' %}", {
            method: "POST",
            body: new FormData(document.querySelector('#form'))
        }).then((response) => {
            if (response.ok) {
                refreshItems();
                closeModal();
            } else {
                alert("Gagal menambahkan item via AJAX.");
            }
        });
    });
</script>
