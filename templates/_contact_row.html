<tr id="contact-{{ contact.id }}">
    <td>{{ contact.name }}</td>
    <td>{{ contact.email }}</td>
    <td>{{ contact.phone|default:"-" }}</td>
    <td>
        <button hx-get="{% url 'main:contact_edit' contact.id %}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="button button-secondary">
            Edit
        </button>
        <button hx-delete="{% url 'main:contact_delete' contact.id %}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Yakin hapus {{ contact.name }}?"
                class="button button-danger">
            Hapus
        </button>
    </td>
</tr>
